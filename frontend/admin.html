<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse AI — Admin Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">

  <!-- API Configuration -->
  <script>window.__PULSE_API_URL__ = 'https://pulse-ai-r2d1.onrender.com/api/v1';</script>
</head>
<body class="admin-page">

  <!-- ========== LOGIN SCREEN ========== -->
  <div id="adminLogin" class="admin-login">
    <div class="admin-login-card">
      <svg viewBox="0 0 64 64" width="48" height="48"><circle cx="32" cy="32" r="30" fill="#DC2F3D"/><path d="M8 32H22L27 18L36 46L41 32H56" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Admin Access</h1>
      <p>Enter the admin secret key to continue.</p>
      <form id="adminLoginForm">
        <input type="password" id="adminKey" placeholder="Admin secret key" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary">Enter</button>
        <p id="adminLoginError" class="auth-error"></p>
      </form>
    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div id="adminDashboard" class="admin-dashboard" style="display:none;">
    <!-- Header -->
    <header class="admin-header">
      <div class="admin-header-left">
        <a href="/" class="logo">
          <svg class="logo-mark" viewBox="0 0 64 64" width="26" height="26"><circle cx="32" cy="32" r="30" fill="#DC2F3D"/><path d="M8 32H22L27 18L36 46L41 32H56" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Pulse AI
        </a>
        <span class="admin-badge">Admin</span>
      </div>
      <button class="admin-logout-btn" id="adminLogoutBtn">Logout</button>
    </header>

    <main class="admin-main">
      <!-- Stats -->
      <div class="admin-stats" id="adminStats">
        <div class="stat-card">
          <span class="stat-number" id="statTotal">—</span>
          <span class="stat-label">Total Sign-ups</span>
        </div>
        <div class="stat-card stat-pending">
          <span class="stat-number" id="statPending">—</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card stat-approved">
          <span class="stat-number" id="statApproved">—</span>
          <span class="stat-label">Approved</span>
        </div>
        <div class="stat-card stat-rejected">
          <span class="stat-number" id="statRejected">—</span>
          <span class="stat-label">Rejected</span>
        </div>
      </div>

      <!-- Filter tabs -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-filter="pending">Pending</button>
        <button class="admin-tab" data-filter="approved">Approved</button>
        <button class="admin-tab" data-filter="rejected">Rejected</button>
        <button class="admin-tab" data-filter="">All</button>
      </div>

      <!-- Sign-ups table -->
      <div class="admin-table-wrap">
        <table class="admin-table" id="adminTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Source</th>
              <th>Status</th>
              <th>Signed up</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <tr><td colspan="6" class="table-empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/admin.js"></script>
</body>
</html>
