<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse AI — Chat</title>

  <!-- Meta -->
  <meta name="description" content="Pulse AI Health Assistant — Ask health questions and receive responsible guidance.">
  <meta name="theme-color" content="#FCFCFB">

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chat.css">

  <!-- API Configuration -->
  <script>window.__PULSE_API_URL__ = 'https://pulse-ai-r2d1.onrender.com/api/v1';</script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body class="chat-page">

  <!-- ========== SIDEBAR ========== -->
  <aside class="chat-sidebar" id="chatSidebar">
    <div class="sidebar-header">
      <a href="/" class="logo">
        <svg class="logo-mark" viewBox="0 0 64 64" width="28" height="28">
          <circle cx="32" cy="32" r="30" fill="#DC2F3D"/>
          <path d="M8 32H22L27 18L36 46L41 32H56" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Pulse AI
      </a>
      <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">&times;</button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>

    <div class="conversations-list" id="conversationsList">
      <p class="conversations-empty">No conversations yet.</p>
    </div>

    <div class="sidebar-footer">
      <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">U</div>
        <span class="user-name" id="userName">User</span>
      </div>
      <a href="/profile.html" class="sidebar-link" title="Health Profile">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
      <button class="logout-btn" id="logoutBtn" aria-label="Log out">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- ========== MAIN CHAT AREA ========== -->
  <main class="chat-main">
    <!-- Top bar -->
    <header class="chat-topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="chat-topbar-title" id="chatTopbarTitle">New Chat</span>
      <a href="/" class="topbar-home" aria-label="Go to home page">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
    </header>

    <!-- Messages -->
    <div class="chat-messages-container" id="chatMessages">
      <div class="chat-welcome">
        <svg viewBox="0 0 64 64" width="56" height="56"><circle cx="32" cy="32" r="30" fill="#DC2F3D"/><path d="M8 32H22L27 18L36 46L41 32H56" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h2>How can I help you today?</h2>
        <p>Ask me anything about health, wellness, or symptoms.<br>I'll provide general guidance — never a diagnosis.</p>
        <div class="welcome-suggestions">
          <button class="suggestion-btn" data-msg="What are common causes of persistent headaches?">Common causes of headaches</button>
          <button class="suggestion-btn" data-msg="When should I see a doctor about chest pain?">When to see a doctor</button>
          <button class="suggestion-btn" data-msg="What are the early signs of diabetes?">Early signs of diabetes</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <form class="chat-input-container" id="chatForm" autocomplete="off">
      <div class="chat-input-wrapper">
        <textarea id="chatInput" placeholder="Ask a health question..." maxlength="2000" rows="1" aria-label="Type your health question"></textarea>
        <button type="submit" id="chatSend" class="chat-send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="chat-disclaimer-line">Pulse AI provides general health information. Not a substitute for professional medical advice.</p>
    </form>
  </main>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
